                      rules = [r for r in rules if r.get("action") == "resolve"]
                  outbound = ({"type": "direct", "tag": "direct"} if use_real_direct
                              else {"type": "socks", "tag": "direct", "server": "127.0.0.1", "server_port": sink_port})
