          }}
          """)
                  ng = subprocess.Popen(["nginx", "-p", srv_dir, "-c", f"{srv_dir}/nginx.conf"], stderr=subprocess.DEVNULL)

                  with open(f"{srv_dir}/singbox/10-inbound-vless.json") as f:
                      inb = json.load(f)
                  inb["inbounds"][0]["listen"] = "127.0.0.1"
                  with open(f"{srv_dir}/singbox/10-inbound-vless.json", "w") as f:
                      json.dump(inb, f)
                  with open(f"{srv_dir}/singbox/90-route.json") as f:
                      rt = json.load(f)
                  rt["route"]["rules"] = []
                  with open(f"{srv_dir}/singbox/90-route.json", "w") as f:
                      json.dump(rt, f)

                  sb_srv = subprocess.Popen(["sing-box", "run", "-C", f"{srv_dir}/singbox"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                  time.sleep(0.7)

                  def make_client(uuid_val, lport):
                      cfg = {
                          "log": {"level": "error"},
                          "inbounds": [{"type": "socks", "listen": "127.0.0.1", "listen_port": lport}],
                          "outbounds": [{
                              "type": "vless",
                              "server": "127.0.0.1",
                              "server_port": vless_port,
                              "uuid": uuid_val,
                              "flow": "xtls-rprx-vision",
                              "tls": {
                                  "enabled": True,
                                  "server_name": "node.example.com",
                                  "utls": {"enabled": True, "fingerprint": "chrome"},
                                  "reality": {"enabled": True, "public_key": pub_key, "short_id": "0123456789abcdef"}
                              }
                          }]
                      }
                      p = os.path.join(tmp, f"cli_{lport}.json")
                      with open(p, "w") as f:
                          json.dump(cfg, f)
                      return subprocess.Popen(["sing-box", "run", "-c", p], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)

                  def socks_http_get(lport, path):
                      s = socket.create_connection(("127.0.0.1", lport), timeout=3)
                      s.sendall(b"\x05\x01\x00")
                      assert s.recv(2) == b"\x05\x00"
                      s.sendall(b"\x05\x01\x00\x01" + socket.inet_aton("127.0.0.1") + target_port.to_bytes(2, "big"))
                      rep = s.recv(10)
                      if len(rep) < 2 or rep[1] != 0:
                          s.close()
                          return ""
                      s.sendall(f"GET {path} HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n".encode())
                      data = b""
                      while True:
                          c = s.recv(4096)
                          if not c:
                              break
                          data += c
                      s.close()
                      return data.decode("latin1", "replace")

                  cli_good = make_client(good_uuid, socks_port)
                  cli_bad = make_client(bad_uuid, bad_socks_port)
                  time.sleep(0.5)

                  # Scenario 1: Valid REALITY + valid UUID -> 200 TARGET_OK
                  r1 = socks_http_get(socks_port, "/s1")
                  assert "TARGET_OK" in r1 and "/s1" in hits

                  # Scenario 2: Valid REALITY + wrong UUID -> VLESS closes/rejects; neither reaches target nor falls back to Nginx HTML
                  try:
                      r2 = socks_http_get(bad_socks_port, "/s2")
                  except Exception:
                      r2 = ""
                  assert "TARGET_OK" not in r2 and "<html" not in r2.lower() and "/s2" not in hits

                  def raw_tls_http(sni, path="/"):
                      ctx = ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT)
                      ctx.check_hostname = False
                      ctx.verify_mode = ssl.CERT_NONE
                      raw = socket.create_connection(("127.0.0.1", vless_port), timeout=3)
                      ss = ctx.wrap_socket(raw, server_hostname=sni)
                      ss.sendall(f"GET {path} HTTP/1.1\r\nHost: node.example.com\r\nConnection: close\r\n\r\n".encode())
                      out = b""
                      while True:
                          c = ss.recv(4096)
                          if not c:
                              break
                          out += c
                      ss.close()
                      return out.decode("latin1", "replace")

                  # Scenario 3: Unauthenticated TLS + known SNI -> transparent fallback to Nginx (including symlink traversal block)
                  r3_200 = raw_tls_http("node.example.com", "/")
                  r3_404a = raw_tls_http("node.example.com", "/missing")
                  r3_404b = raw_tls_http("node.example.com", "/p0123456789abcde/bad/v2ray")
                  r3_leak_www = raw_tls_http("node.example.com", "/leak.txt")
                  r3_leak_sub = raw_tls_http("node.example.com", f"/p0123456789abcde/{'a'*64}/leak.txt")
                  r3_sub = raw_tls_http("node.example.com", f"/p0123456789abcde/{'a'*64}/v2ray")
                  assert "HTTP/1.1 200 OK" in r3_200 and "<!DOCTYPE html>" in r3_200 and "· rev " not in r3_200
                  assert "HTTP/1.1 404 Not Found" in r3_404a and r3_404a.split("\r\n\r\n", 1)[1] == r3_404b.split("\r\n\r\n", 1)[1]
                  assert "HTTP/1.1 404 Not Found" in r3_leak_www and "TOP_SECRET_LEAK" not in r3_leak_www
                  assert "HTTP/1.1 404 Not Found" in r3_leak_sub and "TOP_SECRET_LEAK" not in r3_leak_sub
                  assert "HTTP/1.1 200 OK" in r3_sub and "SUB_OK" in r3_sub

                  # Scenarios 4 & 5: Unauthenticated TLS + wrong SNI / empty SNI across capability branch
                  for probe_sni in ("wrong.example.com", None):
                      if reject_mode == "true":
                          rejected = False
                          try:
                              _ = raw_tls_http(probe_sni, "/")
                          except (ssl.SSLError, ConnectionError, OSError):
                              rejected = True
                          assert rejected, f"Expected TLS handshake rejection for SNI={probe_sni}"
                      else:
                          assert "HTTP/1.1 200 OK" in raw_tls_http(probe_sni, "/")

                  # Scenario 6: Premature EOF during TLS handshake & half-closed connection -> server stays healthy
                  for payload in (b"", b"\x16\x03\x01\x00\x50\x01\x00\x00"):
                      s = socket.create_connection(("127.0.0.1", vless_port), timeout=2)
                      if payload:
                          s.sendall(payload)
                      s.close()
                  assert "TARGET_OK" in socks_http_get(socks_port, "/after-eof") and "/after-eof" in hits

                  for p in (cli_good, cli_bad, sb_srv, ng):
                      p.terminate()
                  httpd.shutdown()
              finally:
                  shutil.rmtree(tmp, ignore_errors=True)
          PY
