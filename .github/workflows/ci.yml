                      f'"SET:VLESS_PORT={vless_port}" "SET:REALITY_HANDSHAKE_PORT={hs_port}" '
                      f'"SET:REALITY_PRIVATE_KEY={priv_key}" "SET:REALITY_PUBLIC_KEY={pub_key}" '
                      '"SET:REALITY_SHORT_ID=0123456789abcdef" "SET:SUB_PATH_PREFIX=p0123456789abcde" '
                      f'\'SET:SUBSCRIPTIONS="u1"\' "SET:UUID_U1={good_uuid}" "SET:SUB_TOKEN_U1={"a"*64}"'
                  ], env=env)
                  subprocess.check_call(["bash", "scripts/40-deploy-server.sh", "--render-only", srv_dir], env=env, stdout=subprocess.DEVNULL)

                  os.makedirs(f"{srv_dir}/tmp", exist_ok=True)
                  os.makedirs(f"{srv_dir}/releases/r1/p0123456789abcde/{'a'*64}", exist_ok=True)
