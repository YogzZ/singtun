          import json, os, re, shutil, socket, ssl, subprocess, tempfile, threading, time
          from http.server import BaseHTTPRequestHandler, HTTPServer

          ver_out = subprocess.check_output(["nginx", "-v"], stderr=subprocess.STDOUT, text=True)
          m = re.search(r"nginx/(\d+)\.(\d+)\.(\d+)", ver_out)
          modes = ["false"]
          if m and (int(m.group(1)), int(m.group(2)), int(m.group(3))) >= (1, 19, 4):
              modes.insert(0, "true")

          def free_port():
              with socket.socket() as s:
                  s.bind(("127.0.0.1", 0))
                  return s.getsockname()[1]

          for reject_mode in modes:
              tmp = tempfile.mkdtemp(prefix=f"reality6_{reject_mode}_")
              try:
                  hs_port, vless_port, socks_port, bad_socks_port, target_port = [free_port() for _ in range(5)]
                  hits = []
                  class H(BaseHTTPRequestHandler):
                      def do_GET(self):
                          hits.append(self.path)
                          self.send_response(200)
                          self.end_headers()
                          self.wfile.write(b"TARGET_OK")
                      def log_message(self, *a):
                          pass
                  httpd = HTTPServer(("127.0.0.1", target_port), H)
                  threading.Thread(target=httpd.serve_forever, daemon=True).start()

