                  assert socks_req(sp_loop_enf, "domain", "rebind-loop.example.com", loop_port) == ""
                  assert socks_req(sp_loop_enf, "domain", "localhost", loop_port) == ""
                  assert len(loop_hits) == 0
                  for atyp, tgt in unicast_v4:
