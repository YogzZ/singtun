# Managed by singtun (40-deploy-server.sh)
# REALITY Self-steal 回落站点：仅监听本机 127.0.0.1，不对公网直接暴露端口
__NGINX_UNKNOWN_SNI_SERVER_BLOCK__
server {
    listen 127.0.0.1:__REALITY_HANDSHAKE_PORT__ __NGINX_MAIN_LISTEN_OPTS__;
    server_name __SERVER_DOMAIN__;

    ssl_certificate     /etc/singtun/cert/fullchain.pem;
    ssl_certificate_key /etc/singtun/cert/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/singtun-site;
    index index.html;

    server_tokens off;
    access_log off;
    charset utf-8;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 15s;
    reset_timedout_connection on;
    disable_symlinks on from=$document_root;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

__NGINX_SUB_LOCATION_BLOCK__

    location / {
        try_files $uri $uri/ =404;
    }
}
